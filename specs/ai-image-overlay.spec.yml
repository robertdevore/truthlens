name: "TruthLens AI image blur overlay"
goal: "Make likely AI-generated images unmistakable without hiding confidence evidence, and verify the result on a Google Images search for real people."
version: "1.0.0"
priority: "high"
status: "ready"
scope: "Content-script presentation and browser verification only; the detector model and 65 percent AI threshold remain unchanged."
non_goals:
  - "Changing the classifier, calibration, or confidence threshold"
  - "Blurring real or uncertain images"
acceptance_criteria:
  - "An image with an AI verdict is visibly blurred"
  - "The AI label is centered over the affected image and includes its confidence"
  - "Real and uncertain verdicts do not blur their images"
  - "The label exposes an accessible verdict and confidence name"
  - "A Google Images search for real person is exercised with the extension and its observed verdicts are recorded"
eval_requirements:
  - description: "Complete source and distribution quality gate passes"
    type: "command_succeeds"
    value: "npm run check"
  - description: "AI verdict styling includes the blur marker"
    type: "file_contains"
    value: "src/content.css::.truthlens-ai-image"
  - description: "AI verdict badge is centered over the image"
    type: "file_contains"
    value: "src/content.css::translate(-50%, -50%)"
risks:
  - risk: "Google Images markup and image URLs change without notice"
    severity: "medium"
  - risk: "The private bounty benchmark remains unavailable"
    severity: "high"
review_expectations:
  - "Inspect desktop and mobile Lens screenshots"
  - "Record AI, real, uncertain, and error counts from the Google Images run"
  - "Confirm that each AI verdict has both the blur class and centered badge"
tags:
  - "chrome-extension"
  - "visual-qa"
  - "google-images"
  - "accessibility"
