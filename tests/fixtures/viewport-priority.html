<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>TruthLens viewport priority fixture</title>
  <style>
    body { background: #eef2f7; font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; }
    main { margin: auto; max-width: 900px; }
    .grid { display: grid; gap: 24px; grid-template-columns: repeat(2, 1fr); }
    figure { background: white; border-radius: 16px; margin: 0; overflow: hidden; position: relative; }
    img { display: block; height: 260px; object-fit: cover; width: 100%; }
    figcaption { padding: 12px 16px; }
    .below-fold { margin-top: 1100px; }
  </style>
</head>
<body>
  <main>
    <h1>Visible images should finish first</h1>
    <div class="grid" id="visible-grid">
      <figure><img id="visible-fake" alt="Visible publisher AI example" data-src="/.model-build/examples/example_fake_1.jpg"><figcaption>Visible AI example</figcaption></figure>
      <figure><img id="visible-real" alt="Visible publisher real example" data-src="/.model-build/examples/example_real_1.jpg"><figcaption>Visible real example</figcaption></figure>
    </div>
    <div class="grid below-fold" id="below-grid">
      <figure><img id="below-fake" alt="Below-fold publisher AI example" data-src="/.model-build/examples/example_fake_2.jpg"><figcaption>Below-fold AI example</figcaption></figure>
      <figure><img id="below-real" alt="Below-fold publisher real example" data-src="/.model-build/examples/example_real_2.jpg"><figcaption>Below-fold real example</figcaption></figure>
    </div>
  </main>
  <script>setTimeout(() => document.querySelectorAll('img').forEach((image) => { image.src = image.dataset.src; }), 500);</script>
</body>
</html>
