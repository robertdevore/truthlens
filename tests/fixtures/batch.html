<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width">
  <title>TruthLens batch smoke fixture</title>

    body { margin: 0; }

  </style>
</head>
<body>
  <main>
    <figure><img id="fake-1" alt="AI example one" src="/.model-build/examples/example_fake_1.jpg"></figure>
    <figure><img id="real-1" alt="Real example one" src="/.model-build/examples/example_real_1.jpg"></figure>
    <figure><img id="fake-2" alt="AI example two" src="/.model-build/examples/example_fake_2.jpg"></figure>
    <figure><img id="real-2" alt="Real example two" src="/.model-build/examples/example_real_2.jpg"></figure>
  </main>
</body>
</html>
